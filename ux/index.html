<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbooks UX Walkthrough</title>
<style>
  :root {
    --ink: #14342a; --ink-2: #3f5a50; --muted: #6d8178;
    --bg: #eef1e8; --paper: #fbfcf6; --line: #d9dfd0;
    --forest: #0f3a2c; --forest-2: #17503d; --mint: #2fb783; --mint-soft: #dcf4e8;
    --lilac: #7c5cf0; --lilac-soft: #ece6ff; --amber: #f2b84b; --rose: #c2483f;
    --shadow: 0 1px 2px rgba(15,58,44,.08), 0 12px 32px rgba(15,58,44,.10);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .app { display: grid; grid-template-rows: 56px 1fr; height: 100%; }
  header { display: flex; align-items: center; gap: 16px; padding: 0 20px; background: var(--forest); color: #eaf5ee; }
  .brand { font-weight: 700; letter-spacing: .01em; display: flex; align-items: center; gap: 10px; }
  .brand i { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, #5fe0a8, #2fb783); display: inline-block; }
  .brand small { font-weight: 500; color: #9fc4b3; margin-left: 4px; }
  .spacer { flex: 1; }
  .counter { font-variant-numeric: tabular-nums; color: #b8d6c8; font-size: 13px; }
  .hbtn { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #eaf5ee; border-radius: 10px; padding: 6px 12px; font-size: 13px; }
  .hbtn:hover { background: rgba(255,255,255,.16); }
  .hbtn:focus-visible, .toc button:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
  .progress { height: 3px; background: rgba(255,255,255,.12); position: absolute; left: 0; right: 0; top: 56px; }
  .progress b { display: block; height: 100%; background: var(--mint); width: 0; transition: width .25s ease; }

  main { position: relative; min-height: 0; }
  .slide { position: absolute; inset: 0; display: none; grid-template-columns: minmax(0, 1.55fr) minmax(340px, 1fr); gap: 0; }
  .slide.active { display: grid; }

  /* left: the screen */
  .stage { background: linear-gradient(160deg, #d8e3d6, #e9eee2); padding: 28px 28px 28px 56px; min-height: 0; display: flex; flex-direction: column; }
  .frame { flex: 1; min-height: 0; background: #fff; border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; border: 1px solid #c8d3c3; }
  .chrome { height: 34px; flex: none; display: flex; align-items: center; gap: 7px; padding: 0 14px; background: #f1f4ec; border-bottom: 1px solid var(--line); }
  .chrome span { width: 10px; height: 10px; border-radius: 50%; background: #cdd6c7; }
  .chrome em { margin-left: 10px; font-style: normal; font-size: 12px; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 2px 12px; }
  .scroller { flex: 1; min-height: 0; overflow: auto; background: #f6f7ef; }
  .shot { position: relative; line-height: 0; }
  .shot img { width: 100%; display: block; }
  .hide-mk .mk { display: none; }
  .mk { position: absolute; transform: translate(-50%, -50%); width: 20px; height: 20px; border-radius: 50%; background: var(--lilac); color: #fff; font: 700 11px/20px system-ui; opacity: .92; text-align: center; box-shadow: 0 0 0 2px rgba(255,255,255,.95), 0 3px 8px rgba(60,30,160,.35); cursor: pointer; border: 0; padding: 0; transition: transform .15s ease, background .15s; }
  .mk:hover, .mk.on { transform: translate(-50%, -50%) scale(1.3); background: var(--forest); opacity: 1; z-index: 2; }
  .hint { flex: none; margin-top: 10px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }

  .phone-stage { align-items: center; }
  .phone-stage .hint { justify-content: center; } .phone-stage .hint span:last-child { display: none; }
  .phone { width: 330px; max-width: 100%; flex: 1; min-height: 0; border-radius: 34px; background: #0c1f19; padding: 12px; box-shadow: var(--shadow); display: flex; }
  .phone .scroller { border-radius: 24px; }

  /* right: the details */
  .detail { background: var(--paper); border-left: 1px solid var(--line); overflow: auto; padding: 30px 34px 40px; }
  .kicker { font: 700 11px/1 system-ui; letter-spacing: .14em; text-transform: uppercase; color: var(--mint); margin: 0 0 10px; }
  .detail h1 { font-size: 28px; line-height: 1.15; margin: 0 0 10px; letter-spacing: -.01em; }
  .lead { color: var(--ink-2); font-size: 16px; margin: 0 0 22px; }
  h3 { font: 700 11px/1 system-ui; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 26px 0 12px; }
  ol.items, ul.items { list-style: none; margin: 0; padding: 0; }
  .items li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 10px 10px; margin: 0 -10px; border-radius: 10px; transition: background .15s; }
  .items li:hover, .items li.on { background: #f0f3ea; }
  .num { width: 24px; height: 24px; border-radius: 50%; background: var(--lilac-soft); color: var(--lilac); font: 700 12px/24px system-ui; text-align: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); margin: 8px 8px; }
  .items b { display: block; font-size: 14.5px; }
  .items span { color: var(--ink-2); font-size: 14px; }
  .rules { margin: 0; padding: 0; list-style: none; }
  .rules li { position: relative; padding: 0 0 8px 20px; color: var(--ink-2); font-size: 14px; }
  .rules li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 7px; height: 7px; border-radius: 2px; background: var(--forest-2); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; background: #e8ede1; color: var(--ink-2); border-radius: 8px; padding: 6px 8px; }
  .chip.role { background: var(--mint-soft); color: var(--forest-2); font-family: system-ui; }
  .note { margin-top: 22px; padding: 12px 14px; border-radius: 12px; background: #fff6e0; color: #6b4d0c; font-size: 13.5px; border: 1px solid #f1dca6; }

  /* text-only slides */
  .full { grid-column: 1 / -1; overflow: auto; padding: 48px 56px 56px; background: radial-gradient(1100px 500px at 85% -10%, #dff3e8 0, transparent 60%), var(--paper); }
  .full .inner { max-width: 1080px; margin: 0 auto; }
  .full h1 { font-size: 44px; line-height: 1.08; letter-spacing: -.02em; margin: 6px 0 14px; }
  .full .lead { font-size: 19px; max-width: 760px; }
  .cover { background: linear-gradient(135deg, var(--forest) 0%, #17503d 55%, #2b4c6b 100%); color: #eaf5ee; display: flex; align-items: center; }
  .cover h1 { font-size: 64px; color: #fff; max-width: 820px; }
  .cover .lead { color: #bfd9cb; }
  .cover .kicker { color: #b7f25f; }
  .pillrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
  .pill { border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #d7eadf; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-top: 26px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: 0 1px 2px rgba(15,58,44,.05); }
  .card b { display: block; margin-bottom: 4px; }
  .card span { color: var(--ink-2); font-size: 14px; }
  .flow { display: flex; align-items: stretch; gap: 8px; margin-top: 28px; flex-wrap: wrap; }
  .step { flex: 1; min-width: 150px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; position: relative; }
  .step i { font: 700 11px/1 system-ui; color: var(--lilac); letter-spacing: .1em; font-style: normal; }
  .step b { display: block; margin: 6px 0 2px; }
  .step span { color: var(--ink-2); font-size: 13.5px; }
  .step:not(:last-child)::after { content: "→"; position: absolute; right: -14px; top: 50%; transform: translateY(-50%); color: var(--muted); z-index: 1; }
  table { border-collapse: collapse; width: 100%; background: #fff; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); margin-top: 22px; font-size: 14px; }
  th, td { padding: 10px 12px; text-align: center; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { background: #f1f4ec; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  td.y { color: var(--forest-2); font-weight: 700; } td.n { color: #b8c3b8; }


  .toc { position: fixed; inset: 56px 0 0 0; background: rgba(12,31,25,.55); z-index: 20; display: none; }
  .toc.open { display: block; }
  .toc .panel { position: absolute; left: 0; top: 0; bottom: 0; width: min(420px, 92vw); background: var(--paper); overflow: auto; padding: 18px 18px 40px; box-shadow: var(--shadow); }
  .toc h4 { margin: 18px 6px 6px; font: 700 11px/1 system-ui; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .toc button { display: flex; gap: 10px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 10px; padding: 8px 10px; }
  .toc button:hover, .toc button.cur { background: var(--mint-soft); }
  .toc button small { color: var(--muted); min-width: 22px; font-variant-numeric: tabular-nums; }

  @media (max-width: 900px) {
    body { overflow: auto; } .app { height: auto; min-height: 100%; } main { min-height: calc(100vh - 56px); }
    .slide.active { display: block; position: relative; }
    .stage { padding: 14px; height: 70vh; } .detail { border-left: 0; }
    .cover h1 { font-size: 40px; } .full { padding: 28px 20px; }
  }
  @media print { header, .progress, .hint { display: none; } body { overflow: visible; } .slide { position: relative; display: grid; page-break-after: always; height: 100vh; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><i></i>Chatbooks <small>UX walkthrough</small></div>
    <div class="spacer"></div>
    <span class="counter" id="counter"></span>
    <button class="hbtn" id="prev" aria-label="Previous slide">← Prev</button>
    <button class="hbtn" id="next" aria-label="Next slide">Next →</button>
    <button class="hbtn" id="mkBtn" aria-pressed="true" title="Show or hide markers (M)">Markers (M)</button>
    <button class="hbtn" id="tocBtn" aria-haspopup="dialog">Contents (G)</button>
  </header>
  <div class="progress"><b id="bar"></b></div>
  <main id="main">
  </main>
</div>
<div class="toc" id="toc"><div class="panel" id="tocPanel"></div></div>

<script>
// Hotspots are [x, y] in pixels of the screenshot's natural size (1440 wide for desktop, 390 for mobile).
const R = (s) => s; // marker for readability
const slides = [
  { type: 'cover' },
  { type: 'principles' },

  // ---------- Access ----------
  { section: 'Getting in', title: 'Sign in', url: '/login', img: '01-login.png', kicker: 'Access',
    lead: 'A calm, two-panel entry. The brand promise sits on the left; the only action on the page sits on the right.',
    items: [
      ['Brand panel', 'Headline, short reassurance and the companion character. It sets tone: plain words, review before anything changes.'],
      ['Username or email', 'One field for either identifier, so people do not have to remember which they registered with.'],
      ['Sign in', 'Primary action. Shows “Please wait…” while the request runs and is disabled until the session state is known.'],
      ['Trust line', '“Financial changes always wait for validation and review.” States the core safety rule before the user has typed anything.'],
      ['Create one', 'Link to registration for new users.'],
      ['Proof points', '“Deterministic checks” and “Auditable history” echo what the ledger guarantees.'],
    ],
    hot: [[290,300],[1098,487],[1098,645],[1098,696],[1166,752],[380,932]],
    rules: ['Errors appear inline above the button; the form keeps what was typed.', 'A ?next= parameter returns people to the page that sent them here after sign-in.', 'Sessions are opaque tokens held in HTTP-only cookies; browser JavaScript never sees them.'],
    data: ['POST /auth/token', 'GET /auth/me'] },

  { section: 'Getting in', title: 'Create account', url: '/register', img: '02-register.png', kicker: 'Access',
    lead: 'Same layout as sign-in, with a friendlier heading and one extra field. The user is signed in immediately after creating the account.',
    items: [
      ['Your name', 'Shown in the sidebar profile and on confirmations.'],
      ['Username or email', 'Unique across the product. A taken name returns a clear “already registered” message.'],
      ['Password', 'Hint reads “Use at least 12 characters.” The browser enforces the minimum before the request is sent.'],
      ['Create account', 'Registers, signs in, then lands on Chat where business setup is offered.'],
      ['Already have an account?', 'Switches back to sign-in.'],
    ],
    rules: ['New-password autofill hints are set so password managers offer to generate one.', 'No email verification step exists yet.'],
    data: ['POST /auth/register', 'POST /auth/token'] },

  { section: 'Getting in', title: 'Create your business', url: '/chat (first run)', img: '03a-onboarding.png', kicker: 'First-run setup',
    lead: 'A new user has no financial context yet. Instead of an empty app, the first screen asks for the three facts every ledger needs.',
    items: [
      ['Business name', 'Becomes the “financial context” shown in the sidebar switcher.'],
      ['Currency code', 'Three uppercase letters, such as USD or BDT. Fixed for the life of the business.'],

    hot: [[844,473],[636,564],[1052,564],[844,655]],
    rules: ['Each business ledger is isolated; nothing is shared between organizations.', 'After creation the user adds accounts and an open period (see Money and Settings).'],
    data: ['POST /organizations'] },

  // ---------- Shell ----------
  { section: 'App shell', title: 'Navigation and context switcher', url: 'every signed-in page', img: '19-context-switcher.png', kicker: 'App shell',
    lead: 'One persistent sidebar frames every screen. It answers three questions at a glance: where am I, whose books are these, and who am I signed in as.',
    items: [
      ['Financial context', 'The switcher shows the active space. Opening it lists Personal and each Business with the user’s role and currency.'],
      ['Personal space', 'Visible but marked “Available in a future milestone”. It cannot be selected yet.'],
      ['Businesses', 'Each row shows name, role (Owner, Accountant…) and currency. Choosing one reloads Money, Reports, Projects and Settings for that ledger.'],
    ],
    hot: [[123,120],[80,205],[120,310]],
    rules: ['Primary navigation: Chat, Money, Activity, Reports, Projects, Settings. Projects only appears in a business space.', 'The companion card (“Small steps. Clear books.”) is a reminder that every financial change waits for review.', 'The profile area at the bottom shows the user name and role, and holds the Log out button.', 'Escape closes the switcher; the active page is highlighted in the sidebar.'],
    data: ['GET /organizations'] },

  { section: 'App shell', title: 'Mobile navigation', url: 'under 900px', img: '23-mobile-more-menu.png', phone: true, kicker: 'App shell',
    lead: 'On phones the sidebar becomes a bottom bar so the four daily destinations stay one tap away.',
    items: [
      ['Four primary tabs', 'Chat, Money, Activity and Reports.'],
      ['More', 'Opens a small menu with Projects and Settings. The More tab is highlighted when either of those pages is open.'],
      ['Top bar', 'Brand mark plus the financial-context switcher, so the active ledger is always visible.'],
    ],
    rules: ['Menu is a proper popup menu: it traps focus, closes on Escape and on outside tap.', 'Layouts collapse to a single column; wide tables become stacked rows.'] },

  // ---------- Chat ----------
  { section: 'Chat', title: 'Chat workspace', url: '/chat', img: '03-chat.png', kicker: 'Chat',
    lead: 'The front door for “tell me what happened with my money”. Today it previews the experience honestly: nothing is sent, and nothing can post.',
    items: [
      ['Space bar', 'Names the active business so every message has a clear ledger.'],
      ['AI actions unavailable', 'A status pill that states plainly the assistant is not connected.'],
      ['Conversation hero', '“What do you want to do with your money?” with the companion and a promise that chat never posts directly.'],
      ['Assistant message', 'Explains the current limit and points to the verified workflows below.'],
      ['Composer', 'Text box with attach-document button. Enter previews, Shift+Enter adds a line. Footer repeats: “Nothing is sent or posted.”'],

    hot: [[375,32],[1290,33],[660,400],[680,765],[668,846],[1250,200],[1260,410],[1250,612]],
    rules: ['Quick-start cards under the composer jump to Activity, Reports and Record an event.', 'A future assistant may only create a proposal; confirmation and posting stay human actions.', 'Personal space shows “Personal proposal creation remains unavailable.”'],
    data: ['No network calls for the message itself'] },

  // ---------- Money ----------
  { section: 'Money', title: 'Money overview', url: '/money', img: '04-money-overview.png', kicker: 'Money',

  { section: 'Money', title: 'Account detail', url: '/money/accounts/{id}', img: '17-account-detail.png', kicker: 'Money',
    lead: 'One account, one screen: its balance, its identity and a way to see what moved it.',
    items: [
      ['Back to Money', 'Returns to the overview.'],
      ['Current balance', 'Ledger-derived, with “Debit balance” or “Credit balance” spelled out.'],

  { section: 'Money', title: 'Income', url: '/money → Income', img: '06-money-income.png', kicker: 'Money',

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { show(cur + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(cur - 1); }
  else if (e.key === 'Home') show(0); else if (e.key === 'End') show(nodes.length - 1);
  else if (e.key.toLowerCase() === 'g') toggleToc(); else if (e.key.toLowerCase() === 'm') toggleMk(); else if (e.key === 'Escape') toc.classList.remove('open');
});
show((parseInt(location.hash.slice(1), 10) || 1) - 1, false);
</script>
</body>
